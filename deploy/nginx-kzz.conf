# 部署步骤：
#   sudo cp deploy/nginx-kzz.conf /etc/nginx/sites-available/kzz.bukui.fun
#   sudo ln -s /etc/nginx/sites-available/kzz.bukui.fun /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d kzz.bukui.fun
# certbot 会自动改写本文件，加上 HTTPS 监听与 80->443 的 301 跳转。
# 如不想用 certbot，可手动补 listen 443 ssl 段并配置证书路径。

server {
    listen 80;
    server_name kzz.bukui.fun;

    # 日志（可选）
    # access_log /var/log/nginx/kzz.access.log;
    # error_log  /var/log/nginx/kzz.error.log;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
